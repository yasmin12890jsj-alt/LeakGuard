<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevenueGuard AI | نظام مراقبة وكشف تسرب الإيرادات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'Plus Jakarta Sans', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      .glow-orb {
        animation: pulseGlow 3.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .glow-orb { animation: none; }
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen pb-24 transition-colors duration-200">
    <!-- شاشة الافتتاح Intro / Splash -->
    <div id="splashScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#050d1a] text-white px-6 overflow-hidden">
      <div class="glow-orb absolute w-80 h-80 rounded-full bg-sky-500/20 blur-3xl pointer-events-none"></div>
      <div class="glow-orb absolute w-64 h-64 rounded-full bg-indigo-500/20 blur-3xl translate-x-24 -translate-y-16 pointer-events-none"></div>

      <div class="relative z-10 max-w-xl text-center space-y-5">
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-sky-500/10 border border-sky-400/30 text-sky-300 text-xs font-semibold">
          <span>AI Financial Shield</span>
          <span>•</span>
          <span>v1.2</span>
        </div>

        <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-l from-sky-300 via-white to-indigo-300 bg-clip-text text-transparent drop-shadow">
          REVENUEGUARD AI
        </h1>
        <p class="text-lg font-bold text-sky-300">
          نظام ذكي لمراقبة وكشف تسرب الإيرادات
        </p>
        <p class="text-slate-300 text-base sm:text-lg leading-relaxed">
          احمِ إيراداتك، اكتشف التسرب، وسيطر على مستقبلك المالي.
        </p>

        <div class="pt-4 flex flex-wrap items-center justify-center gap-3">
          <button id="enterSystemBtn" type="button" class="px-6 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-95 text-slate-950 font-bold transition shadow-lg shadow-sky-500/25 cursor-pointer">
            الدخول إلى النظام
          </button>
          <button id="muteToggleBtn" type="button" class="px-4 py-2.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-sm text-slate-200 transition cursor-pointer">
            🔊 الصوت: مفعل
          </button>
          <button id="skipSplashBtn" type="button" class="px-4 py-2.5 rounded-xl text-sm text-slate-400 hover:text-white transition cursor-pointer">
            تخطي (Skip) ←
          </button>
        </div>
      </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="appShell" class="min-h-screen flex flex-col">
      <!-- الشريط العلوي -->
      <header class="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800/80 bg-white/90 dark:bg-slate-900/85 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-indigo-600 flex items-center justify-center font-extrabold text-slate-950 shadow">
              RG
            </div>
            <div>
              <div class="font-extrabold text-base sm:text-lg leading-tight">REVENUEGUARD AI</div>
              <div class="text-xs text-slate-500 dark:text-slate-400">مراقبة الإيرادات والتحليل المالي</div>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <!-- زر تبديل الوضع الليلي والصباحي -->
            <button id="themeBtn" type="button" class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 text-xs font-bold transition" title="تبديل الوضع الليلي والصباحي">
              ☀️ صباحي
            </button>

            <!-- اختيار اللغة -->
            <select id="langSelect" class="bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:outline-none focus:border-sky-400">
              <option value="ar">العربية (RTL)</option>
              <option value="en">English (LTR)</option>
              <option value="fr">Français (LTR)</option>
            </select>

            <!-- اختيار العملة -->
            <select id="currencySelect" class="bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:outline-none focus:border-sky-400">
              <option value="DZD">DZD (د.ج)</option>
              <option value="USD">USD ($)</option>
              <option value="EUR">EUR (€)</option>
              <option value="GBP">GBP (£)</option>
            </select>

            <!-- إعادة عرض الافتتاحية -->
            <button id="reopenSplashBtn" type="button" class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 text-xs transition">
              Intro
            </button>
          </div>
        </div>

        <!-- شريط الفترة الزمنية والبيانات -->
        <div class="border-t border-slate-200 dark:border-slate-800/60 bg-slate-50/90 dark:bg-slate-950/50">
          <div class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex flex-wrap items-center gap-2">
              <select id="yearFilter" class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1 font-semibold">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
              </select>
              <select id="monthFilter" class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1 font-semibold">
                <option value="ALL">كل الأشهر</option>
                <option value="01">يناير / Jan / Janv</option>
                <option value="02">فبراير / Feb / Févr</option>
                <option value="03">مارس / Mar / Mars</option>
                <option value="04">أبريل / Apr / Avr</option>
                <option value="05">مايو / May / Mai</option>
                <option value="06">يونيو / Jun / Juin</option>
                <option value="07">يوليو / Jul / Juil</option>
                <option value="08">أغسطس / Aug / Août</option>
                <option value="09">سبتمبر / Sep / Sept</option>
                <option value="10">أكتوبر / Oct / Oct</option>
                <option value="11">نوفمبر / Nov / Nov</option>
                <option value="12">ديسمبر / Dec / Déc</option>
              </select>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <button id
