<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevenueGuard AI | نظام مراقبة وكشف تسرب الإيرادات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-main: #050d1a;
        --bg-card: #0f172a;
        --bg-soft: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #1e293b;
        --accent: #38bdf8;
        --accent-text: #04101f;
      }

      body.light-mode {
        --bg-main: #f1f5f9;
        --bg-card: #ffffff;
        --bg-soft: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #475569;
        --border-color: #cbd5e1;
        --accent: #0284c7;
        --accent-text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        padding-bottom: 84px;
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 16px;
      }

      /* شاشة الافتتاح */
      #splashScreen {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: radial-gradient(circle at top, #0c2444, #050d1a 70%);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      #splashScreen.hidden {
        display: none;
      }

      .splash-box {
        max-width: 560px;
      }

      .splash-title {
        font-size: 36px;
        font-weight: 800;
        margin: 12px 0 8px;
        color: #7dd3fc;
      }

      .splash-sub {
        font-size: 16px;
        font-weight: 700;
        color: #e2e8f0;
        margin-bottom: 10px;
      }

      .splash-desc {
        font-size: 15px;
        color: #cbd5e1;
        margin-bottom: 22px;
        line-height: 1.7;
      }

      /* الشريط العلوي */
      header {
        position: sticky;
        top: 0;
        z-index: 40;
        background-color: var(--bg-card);
        border-bottom: 1px solid var(--border-color);
      }

      .top-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        max-width: 1120px;
        margin: 0 auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-badge {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, #38bdf8, #4f46e5);
        color: #050d1a;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .controls-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      select,
      input,
      button {
        font-family: inherit;
      }

      select,
      input {
        background-color: var(--bg-soft);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13px;
      }

      .btn {
        border: 1px solid var(--border-color);
        background-color: var(--bg-soft);
        color: var(--text-main);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-primary {
        background-color: var(--accent);
        color: var(--accent-text);
        border-color: transparent;
      }

      .filter-bar {
        border-top: 1px solid var(--border-color);
        background-color: var(--bg-main);
      }

      .filter-bar-inner {
        max-width: 1120px;
        margin: 0 auto;
        padding: 8px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      /* البطاقات والأقسام */
      .grid-4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }

      .card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 16px;
      }

      .kpi-label {
        font-size: 12px;
        color: var(--text-muted);
      }

      .kpi-value {
        font-size: 22px;
        font-weight: 800;
        margin-top: 6px;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-color);
        text-align: start;
      }

      th {
        color: var(--text-muted);
        font-size: 12px;
      }

      /* الشريط السفلي بالأيقونات */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background-color: var(--bg-card);
        border-top: 1px solid var(--border-color);
        padding: 6px 8px;
      }

      .bottom-nav-inner {
        max-width: 760px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }

      .nav-item {
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: 12px;
        padding: 6px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }

      .nav-item .icon {
        font-size: 17px;
        line-height: 1;
      }

      .nav-item.active {
        background-color: rgba(56, 189, 248, 0.16);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <!-- شاشة الافتتاح -->
    <div id="splashScreen">
      <div class="splash-box">
        <div class="splash-title">REVENUEGUARD AI</div>
        <div class="splash-sub">نظام ذكي لمراقبة وكشف تسرب الإيرادات</div>
        <p class="splash-desc">احمِ إيراداتك، اكتشف التسرب، وسيطر على مستقبلك المالي.</p>
        <div class="controls-row" style="justify-content: center;">
          <button class="btn btn-primary" onclick="closeSplash()">الدخول إلى النظام</button>
          <button class="btn" id="muteBtn" onclick="toggleMute()">🔊 الصوت: مفعل</button>
          <button class="btn" onclick="closeSplash()">تخطي (Skip)</button>
        </div>
      </div>
    </div>

    <!-- الشريط العلوي -->
    <header>
      <div class="top-bar">
        <div class="brand">
          <div class="logo-badge">RG</div>
          <div>
            <div style="font-weight: 800; font-size: 16px;">REVENUEGUARD AI</div>
            <div style="font-size: 11px; color: var(--text-muted);">مراقبة الإيرادات والتحليل المالي</div>
          </div>
        </div>

        <div class="controls-row">
          <button class="btn" id="themeToggle" onclick="toggleTheme()">☀️ صباحي</button>
          <select id="langSelect" onchange="setLanguage(this.value)">
            <option value="ar">العربية (RTL)</option>
            <option value="en">English (LTR)</option>
            <option value="fr">Français (LTR)</option>
          </select>
          <select id="currencySelect" onchange="setCurrency(this.value)">
            <option value="DZD">DZD (د.ج)</option>
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
          </select>
          <button class="btn" onclick="openSplash()">Intro</button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="filter-bar-inner">
          <div class="controls-row">
            <select id="yearFilter" onchange="renderAll()">
              <option value="2026">2026</option>
              <option value="2025">2025</option>
            </select>
            <select id="monthFilter" onchange="renderAll()">
              <option value="ALL">كل الأشهر</option>
              <option value="01">يناير (01)</option>
              <option value="02">فبراير (02)</option>
              <option value="03">مارس (03)</option>
              <option value="04">أبريل (04)</option>
              <option value="05">مايو (05)</option>
              <option value="06">يونيو (06)</option>
              <option value="07">يوليو (07)</option>
              <option value="08">أغسطس (08)</option>
              <option value="09">سبتمبر (09)</option>
              <option value="10">أكتوبر (10)</option>
              <option value="11">نوفمبر (11)</option>
              <option value="12">ديسمبر (12)</option>
            </select>
          </div>

          <div class="controls-row">
            <button class="btn" onclick="loadDemoData()">+ بيانات تجريبية</button>
            <button class="btn" onclick="clearData()">تفريغ</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- 1. الرئيسية / لوحة التحكم -->
      <section id="tab-dashboard" class="tab-panel active">
        <div class="grid-4">
          <div class="card">
            <div class="kpi-label">الإيرادات المتوقعة</div>
            <div class="kpi-value tabular-nums" id="kpiExpected">0.00 د.ج</div>
          </div>
          <div class="card">
            <div class="kpi-label">الإيرادات المحصلة</div>
            <div class="kpi-value tabular-nums" id="kpiCollected" style="color: #10b981;">0.00 د.ج</div>
          </div>
          <div class="card">
            <div class="kpi-label">الفرق الأولي</div>
            <div class="kpi-value tabular-nums" id="kpiVariance" style="color: #f59e0b;">0.00 د.ج</div>
          </div>
